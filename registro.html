<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear cuenta - Calculadora de Materiales</title>
    <meta name="description" content="Calcular todo tipo de material">
    <meta name="author" content="JHON ANDERSON MANTILLA">
    <link rel="shortcut icon" href="google.png.svg">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <img class="logo" src="logo.png" alt="Materiales">
    <header>
        <h1>Crear cuenta</h1>

        <form id="form-registro">
            <input type="text" name="nombre" placeholder="Nombre completo" required>
            <input type="email" name="correo" placeholder="Correo" required>
            <input type="password" name="password" placeholder="Contraseña (mínimo 6)" required>
            <select name="rol" id="rol">
                <option value="usuario">Perfil: Usuario</option>
                <option value="admin">Perfil: Administrador</option>
            </select>
            <input type="password" name="codigoAdmin" id="codigoAdmin" placeholder="Código de administrador"
                style="display:none;">
            <button type="submit" class="btn-primary">Crear cuenta</button>
        </form>
        <p id="mensaje"></p>

        <p class="divider-text">O regístrate con</p>
        <div class="social-icons">
            <a href="https://accounts.google.com/signin" target="_blank"><img src="google.png.svg" alt="Google"></a>
            <a href="https://www.facebook.com/login" target="_blank"><img src="facebook.png.svg" alt="Facebook"></a>
            <a href="https://www.instagram.com/accounts/login" target="_blank"><img src="instagram-png.svg"
                    alt="Instagram"></a>
            <a href="https://twitter.com/login" target="_blank"><img src="x-twitter-brands-solid-full.svg"
                    alt="Twitter"></a>
        </div>

        <p>¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p>
    </header>

    <script src="api.js"></script>
    <script>
        const rol = document.getElementById('rol');
        const codigo = document.getElementById('codigoAdmin');
        // Muestra el campo del código solo si eligen "admin"
        rol.addEventListener('change', () => {
            codigo.style.display = rol.value === 'admin' ? 'block' : 'none';
        });

        document.getElementById('form-registro').addEventListener('submit', async (e) => {
            e.preventDefault();
            const mensaje = document.getElementById('mensaje');
            try {
                await API.registro(
                    e.target.nombre.value,
                    e.target.correo.value,
                    e.target.password.value,
                    e.target.rol.value,
                    e.target.codigoAdmin.value
                );
                mensaje.textContent = 'Cuenta creada. Redirigiendo...';
                setTimeout(() => location.href = 'login.html', 1000);
            } catch (err) {
                mensaje.textContent = err.message;
            }
        });
    </script>
</body>

</html>
