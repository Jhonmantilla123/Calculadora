<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar contraseña - Calculadora de Materiales</title>
    <meta name="description" content="Calcular todo tipo de material">
    <meta name="author" content="JHON ANDERSON MANTILLA">
    <link rel="shortcut icon" href="google.png.svg">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <img class="logo" src="logo.png" alt="Materiales">
    <header>
        <h1>¿Recuperar contraseña?</h1>

        <form id="form-recuperar">
            <input type="text" name="nombre" placeholder="Nombre completo" required>
            <input type="email" name="correo" placeholder="Correo" required>
            <input type="email" name="confirmar" placeholder="Confirmar correo" required>
            <button type="submit" class="btn-primary">Recuperar contraseña</button>
        </form>
        <p id="mensaje"></p>

        <p>¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p>
    </header>

    <script src="api.js"></script>
    <script>
        document.getElementById('form-recuperar').addEventListener('submit', async (e) => {
            e.preventDefault();
            const mensaje = document.getElementById('mensaje');
            if (e.target.correo.value !== e.target.confirmar.value) {
                mensaje.textContent = 'Los correos no coinciden';
                return;
            }
            try {
                const r = await API.recuperar(e.target.nombre.value, e.target.correo.value);
                mensaje.textContent = r.mensaje;
            } catch (err) {
                mensaje.textContent = err.message;
            }
        });
    </script>
</body>

</html>
