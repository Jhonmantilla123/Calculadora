<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calcular Muro - Calculadora de Materiales</title>
    <link rel="shortcut icon" href="google.png.svg">
    <link rel="stylesheet" href="style.css">
    <script src="api.js"></script>
    <script>API.requerirSesion();</script>
    <script src="calculadora.js" defer></script>
</head>

<body>
    <img class="logo" src="logo.png" alt="Materiales">

    <main class="calc-container" id="vista-formulario">
        <h1>Calcular muro de ladrillo</h1>
        <form id="form-muro">
            <div class="input-group">
                <label for="espesor">Espesor</label>
                <select id="espesor" name="espesor">
                    <option value="20">20 cm</option>
                    <option value="30">30 cm</option>
                </select>
            </div>
            <div class="input-group">
                <label for="largo">Largo (m)</label>
                <input type="number" id="largo" placeholder="Ej: 5" step="0.01" required>
            </div>
            <div class="input-group">
                <label for="alto">Alto (m)</label>
                <input type="number" id="alto" placeholder="Ej: 2.5" step="0.01" required>
            </div>
            <button type="submit" class="btn-calcular">Calcular</button>
        </form>
    </main>

    <div class="calc-container" id="vista-resultado" style="display:none;">
        <h1>Resultado</h1>
        <h2 id="resultado-titulo"></h2>
        <div class="resultado-grid">
            <div class="resultado-card"><span class="resultado-label">Superficie</span><span class="resultado-valor"
                    id="valor-superficie">--</span></div>
            <div class="resultado-card"><span class="resultado-label">Cemento</span><span class="resultado-valor"
                    id="valor-cemento">--</span></div>
            <div class="resultado-card"><span class="resultado-label">Arena</span><span class="resultado-valor"
                    id="valor-arena">--</span></div>
            <div class="resultado-card"><span class="resultado-label">Ladrillos</span><span class="resultado-valor"
                    id="valor-ladrillos">--</span></div>
        </div>
        <button class="btn-volver" onclick="window.location.href='menu.html'">← Volver al menú</button>
        <button class="btn-nuevo" onclick="window.location.href='muro.html'">Calcular de nuevo</button>
    </div>
</body>

</html>
